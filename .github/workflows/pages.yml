name: Deploy introduction to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve latest installer and backup update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/updates
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-Setup.exe' --pattern 'latest.yml' --pattern '*.blockmap' --dir docs/updates --clobber
          node scripts/stage-blockmaps.cjs
          installer=$(find docs/updates -maxdepth 1 -name '*-Setup.exe' -printf '%f\n' | head -n 1)
          test -n "$installer"
          test -s docs/updates/latest.yml
          cat > docs/updates/index.html <<EOF
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cut Player 备用下载</title><h1>Cut Player 最新安装版</h1><p><a href="$installer">下载安装包</a></p><p>下载后关闭播放器，运行安装包覆盖安装，配置与记录保留。</p><p><a href="../">介绍与使用方法</a> · <a href="https://github.com/shandianchengzi/cut-player/releases/latest">GitHub 下载</a></p></html>
          EOF
      - name: Mirror built Pages site to Cloudflare
        continue-on-error: true
        env:
          MIRROR_DIR: docs
          MIRROR_PROJECT: sdz-cut-player
          MIRROR_PREFIX: cut-player
          MIRROR_BRANCH: main
          MIRROR_LARGE_POLICY: skip
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cloudflare-pages-backup.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
