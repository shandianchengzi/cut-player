name: Windows Release
on:
  push:
    branches: [main]
    paths: ['app/**', 'test/**', 'scripts/**', 'release-notes/**', 'package*.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require version-specific release notes
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (!(Test-Path "release-notes/v$version.md")) { throw "Missing release notes for v$version" }
      - run: npm ci
      - name: Fetch matching embedded frame analyzer
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-win32-x64' -OutFile node_modules/ffmpeg-static/ffprobe.exe
      - run: npm test
      - name: Desktop playback and keyboard smoke test
        run: |
          New-Item -ItemType Directory -Force dist
          node scripts/smoke.cjs
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/update-metadata.cjs
      - name: Verify bundled executable and FFmpeg
        run: |
          $env:CUT_PLAYER_PACKAGED_EXE = Join-Path $PWD 'dist/win-unpacked/Cut Player.exe'
          node scripts/smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/portable-update.json
            dist/app-check.png
          if-no-files-found: error
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Cut Player $tag" --notes-file "release-notes/v$version.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file "release-notes/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          Get-ChildItem dist/* | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' -or $_.Name -eq 'portable-update.json' } | ForEach-Object {
            gh release upload $tag $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          }
