name: Windows Release
on:
  push:
    branches: [main]
    paths: ['app/**', 'test/**', 'scripts/**', 'release-notes/**', 'package*.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require version-specific release notes
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (!(Test-Path "release-notes/v$version.md")) { throw "Missing release notes for v$version" }
      - run: npm ci
      - name: Fetch matching embedded frame analyzer
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-win32-x64' -OutFile node_modules/ffmpeg-static/ffprobe.exe
      - run: npm test
      - name: Desktop playback and keyboard smoke test
        run: |
          New-Item -ItemType Directory -Force dist
          node scripts/smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Playback smoke test failed' }
          node scripts/open-file-smoke.cjs
      - name: Benchmark previous release
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/shandianchengzi/cut-player/releases/download/v1.5.6/Cut-Player-1.5.6-x64-Setup.exe' -OutFile "$env:RUNNER_TEMP/baseline-setup.exe"
          $baseline = Join-Path $env:RUNNER_TEMP 'cut-player-baseline'
          $result = Start-Process -FilePath "$env:RUNNER_TEMP/baseline-setup.exe" -ArgumentList '/S',"/D=$baseline" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw 'Baseline install failed' }
          node scripts/benchmark.cjs "$baseline/Cut Player.exe" dist/performance-before.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline benchmark failed' }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify bundled executable and FFmpeg
        run: |
          $env:CUT_PLAYER_PACKAGED_EXE = Join-Path $PWD 'dist/win-unpacked/Cut Player.exe'
          node scripts/smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Playback smoke test failed' }
          node scripts/open-file-smoke.cjs
      - name: Verify actual NSIS installation
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path $PWD "dist/Cut-Player-$version-x64-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'cut-player-installed'
          $result = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$installDir" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "Installer exit code $($result.ExitCode)" }
          $env:CUT_PLAYER_PACKAGED_EXE = Join-Path $installDir 'Cut Player.exe'
          if (!(Test-Path $env:CUT_PLAYER_PACKAGED_EXE)) { throw 'Installed executable missing' }
          if (!(Test-Path (Join-Path $installDir 'resources/app-update.yml'))) { throw 'Installed updater configuration missing' }
          node scripts/smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Playback smoke test failed' }
          node scripts/open-file-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
      - name: Benchmark optimized build
        shell: pwsh
        run: |
          node scripts/benchmark.cjs "$env:RUNNER_TEMP/cut-player-installed/Cut Player.exe" dist/performance-after.json
          if ($LASTEXITCODE -ne 0) { throw 'Optimized benchmark failed' }
          $version = node -p "require('./package.json').version"
          Write-Output "INSTALLER_BYTES before=$((Get-Item $env:RUNNER_TEMP/baseline-setup.exe).Length) after=$((Get-Item dist/Cut-Player-$version-x64-Setup.exe).Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/app-check.png
            dist/performance-*.json
          if-no-files-found: error
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Cut Player $tag" --notes-file "release-notes/v$version.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file "release-notes/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          Get-ChildItem dist/* | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object {
            gh release upload $tag $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          }

      - name: Prepare independent Pages update downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/updates
          Copy-Item dist/*-Setup.exe docs/updates/
          Copy-Item dist/latest.yml docs/updates/latest.yml
          $installer = (Get-ChildItem docs/updates/*-Setup.exe).Name
          Set-Content docs/updates/index.html "<html lang='zh-CN'><meta charset='utf-8'><title>Cut Player 下载</title><h1>Cut Player 最新安装版</h1><a href='$installer'>下载安装包</a><p>下载后关闭播放器，运行安装包覆盖安装。配置保留。</p></html>" -Encoding utf8
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
