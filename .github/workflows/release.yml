name: Windows Release
on:
  push:
    branches: [main]
    paths: ['android/**', 'app/**', 'test/**', 'scripts/**', 'release-notes/**', 'package*.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require version-specific release notes
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (!(Test-Path "release-notes/v$version.md")) { throw "Missing release notes for v$version" }
      - run: npm ci
      - name: Fetch matching embedded frame analyzer
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-win32-x64' -OutFile node_modules/ffmpeg-static/ffprobe.exe
      - run: npm test
      - name: Verify export equivalence and measure throughput
        shell: pwsh
        run: |
          node scripts/export-benchmark.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Export equivalence benchmark failed' }
          Get-Content dist/export-performance.json
      - name: Desktop playback and keyboard smoke test
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force dist
          node scripts/batch-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Batch queue smoke test failed' }
          node scripts/smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Playback smoke test failed' }
          node scripts/open-file-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Open-file smoke test failed' }
          node scripts/tabs-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Tabs smoke test failed' }
      - name: Benchmark previous release
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/shandianchengzi/cut-player/releases/download/v1.5.6/Cut-Player-1.5.6-x64-Setup.exe' -OutFile "$env:RUNNER_TEMP/baseline-setup.exe"
          $baseline = Join-Path $env:RUNNER_TEMP 'cut-player-baseline'
          $result = Start-Process -FilePath "$env:RUNNER_TEMP/baseline-setup.exe" -ArgumentList '/S',"/D=$baseline" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw 'Baseline install failed' }
          node scripts/benchmark.cjs "$baseline/Cut Player.exe" dist/performance-before.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline benchmark failed' }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify real installer differential reconstruction
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Invoke-WebRequest 'https://github.com/shandianchengzi/cut-player/releases/download/v1.5.24/Cut-Player-1.5.24-x64-Setup.exe' -OutFile "$env:RUNNER_TEMP/diff-old.exe"
          Invoke-WebRequest 'https://github.com/shandianchengzi/cut-player/releases/download/v1.5.24/Cut-Player-1.5.24-x64-Setup.exe.blockmap' -OutFile "$env:RUNNER_TEMP/diff-old.blockmap"
          node scripts/differential-benchmark.cjs "$env:RUNNER_TEMP/diff-old.exe" "$env:RUNNER_TEMP/diff-old.blockmap" "dist/Cut-Player-$version-x64-Setup.exe" "dist/Cut-Player-$version-x64-Setup.exe.blockmap"
          if ($LASTEXITCODE -ne 0) { throw 'Real installer differential verification failed' }
      - name: Verify bundled executable and FFmpeg
        run: |
          $env:CUT_PLAYER_PACKAGED_EXE = Join-Path $PWD 'dist/win-unpacked/Cut Player.exe'
          node scripts/batch-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Batch queue smoke test failed' }
          node scripts/smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Playback smoke test failed' }
          node scripts/open-file-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Open-file smoke test failed' }
          node scripts/tabs-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Tabs smoke test failed' }
      - name: Verify actual NSIS installation
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path $PWD "dist/Cut-Player-$version-x64-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'cut-player-installed'
          $result = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$installDir" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "Installer exit code $($result.ExitCode)" }
          $env:CUT_PLAYER_PACKAGED_EXE = Join-Path $installDir 'Cut Player.exe'
          if (!(Test-Path $env:CUT_PLAYER_PACKAGED_EXE)) { throw 'Installed executable missing' }
          if (!(Test-Path (Join-Path $installDir 'resources/app-update.yml'))) { throw 'Installed updater configuration missing' }
          foreach ($notice in @('LICENSE', 'LICENSE-NOTICE.md', 'COMMERCIAL-LICENSE.md')) {
            $installedNotice = Join-Path $installDir "resources/licensing/$notice"
            if (!(Test-Path $installedNotice)) { throw "Installed licensing notice missing: $notice" }
            if ((Get-FileHash $installedNotice).Hash -ne (Get-FileHash $notice).Hash) { throw "Installed licensing notice differs: $notice" }
          }
          node scripts/batch-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Batch queue smoke test failed' }
          node scripts/smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Playback smoke test failed' }
          node scripts/open-file-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Open-file smoke test failed' }
          node scripts/tabs-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Tabs smoke test failed' }
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
      - name: Benchmark optimized build
        shell: pwsh
        run: |
          node scripts/benchmark.cjs "$env:RUNNER_TEMP/cut-player-installed/Cut Player.exe" dist/performance-after.json
          if ($LASTEXITCODE -ne 0) { throw 'Optimized benchmark failed' }
          $version = node -p "require('./package.json').version"
          Write-Output "INSTALLER_BYTES before=$((Get-Item $env:RUNNER_TEMP/baseline-setup.exe).Length) after=$((Get-Item dist/Cut-Player-$version-x64-Setup.exe).Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/app-check.png
            dist/performance-*.json
            dist/export-performance.json
            dist/update-performance.json
          if-no-files-found: error
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Cut Player $tag" --notes-file "release-notes/v$version.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file "release-notes/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          Get-ChildItem dist/* | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object {
            gh release upload $tag $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          }

      - name: Prepare independent Pages update downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force docs/updates
          Copy-Item dist/*-Setup.exe docs/updates/
          Copy-Item dist/latest.yml docs/updates/latest.yml
          Copy-Item dist/*.blockmap docs/updates/
          node scripts/stage-blockmaps.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Backup blockmap staging failed' }
          $installer = (Get-ChildItem docs/updates/*-Setup.exe).Name
          Set-Content docs/updates/index.html "<html lang='zh-CN'><meta charset='utf-8'><title>Cut Player 下载</title><h1>Cut Player 最新安装版</h1><a href='$installer'>下载安装包</a><p>下载后关闭播放器，运行安装包覆盖安装。配置保留。</p></html>" -Encoding utf8
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment

  mirror-release:
    name: Mirror released Pages site to Cloudflare
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the latest published Pages download directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/updates
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-Setup.exe' --pattern 'latest.yml' --pattern '*.blockmap' --dir docs/updates --clobber
          node scripts/stage-blockmaps.cjs
          installer=$(find docs/updates -maxdepth 1 -name '*-Setup.exe' -printf '%f\n' | head -n 1)
          test -n "$installer"
          test -s docs/updates/latest.yml
          cat > docs/updates/index.html <<EOF
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cut Player 备用下载</title><h1>Cut Player 最新安装版</h1><p><a href="$installer">下载安装包</a></p><p><a href="../">介绍与使用方法</a></p></html>
          EOF
      - name: Mirror Pages content (large installer excluded)
        continue-on-error: true
        env:
          MIRROR_DIR: docs
          MIRROR_PROJECT: sdz-cut-player
          MIRROR_PREFIX: cut-player
          MIRROR_BRANCH: main
          MIRROR_LARGE_POLICY: skip
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cloudflare-pages-backup.sh

  android:
    # Keep the packet-reference FFmpeg aligned with bundled 6.1.1 (Ubuntu 26 ships 8.x).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Validate Java and Android API compatibility
        run: gradle -p android --no-daemon compileDebugJavaWithJavac testDebugUnitTest lintDebug
      - uses: actions/cache/restore@v4
        id: native_cache
        with:
          path: |
            android/app/src/main/jniLibs
            android/dist/ffmpeg-6.1.1-source.tar.xz
            android/dist/ffmpeg-*-config.*
          key: android-ffmpeg-6.1.1-ndk28-v1
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cut-player-android-test-signing-v1
      - name: Build bundled native stream-copy tools
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108
        run: bash android/scripts/build-ffmpeg.sh
      - uses: actions/cache/save@v4
        if: steps.native_cache.outputs.cache-hit != 'true'
        with:
          path: |
            android/app/src/main/jniLibs
            android/dist/ffmpeg-6.1.1-source.tar.xz
            android/dist/ffmpeg-*-config.*
          key: android-ffmpeg-6.1.1-ndk28-v1
      - name: Build packet comparison fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          bash android/scripts/make-fixtures.sh
      - name: Build APK and unit checks
        run: gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash android/scripts/device-check.sh
      - name: Prepare Android release files
        run: |
          version=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "android/dist/Cut-Player-$version-android-arm64-v8a-test.apk"
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk "android/dist/Cut-Player-$version-android-x86_64-test.apk"
          cd android/dist
          sha256sum *.apk > android-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
  publish-android:
    needs: [build, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-release
      - name: Publish APK and matching FFmpeg source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v$version" android-release/* --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p docs/updates
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern '*-Setup.exe' --pattern latest.yml --pattern '*.blockmap' --dir docs/updates --clobber
          cp android-release/*arm64-v8a-test.apk docs/updates/
          node scripts/stage-blockmaps.cjs
          installer=$(find docs/updates -name '*-Setup.exe' -printf '%f\n' | head -n 1)
          apk=$(find docs/updates -name '*.apk' -printf '%f\n' | head -n 1)
          printf '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Cut Player 下载</title><h1>Cut Player</h1><p><a href="%s">Windows 安装包</a></p><p><a href="%s">Android arm64 测试 APK</a></p><p>Android 8.0+，测试签名；无损切割，不重新编码。FFmpeg LGPL 2.1+ 对应源码见 GitHub Releases。</p></html>' "$installer" "$apk" > docs/updates/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-android
          path: docs
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-android
        id: deployment
