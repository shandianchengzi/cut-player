<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'"><title>Cut Player</title><link rel="stylesheet" href="style.css">
<header><strong>◉ Cut Player</strong><span>视频时间记录工具</span><button id="settings">快捷键与倍速</button></header>
<main><section class="player"><div class="toolbar"><button id="open">打开视频</button><span id="name">选择本地视频，开始记录</span><input id="file" type="file" accept="video/*,.mkv,.mov,.m4v" hidden></div><video id="video" controls></video><div class="toolbar"><span id="clock">00:00:00.000</span><span id="rate">1×</span><button id="stamp">＋ 记录当前时间</button></div><p>空格 播放 / 暂停 · ← → 快退 / 快进 · ↑ ↓ 音量 · 1—4 切换倍速</p><div id="message" role="status"></div></section><aside><section class="notes-panel"><div class="toolbar"><strong>时间记录</strong><button id="copy">复制全部</button></div><div class="toolbar"><button id="export">按文本切视频</button></div><label><input id="audio" type="checkbox" checked>同时导出无损音频</label><textarea id="notes" placeholder="打开视频后，自动生成 breakpoints 与 names 两行"></textarea><small>记录时间：Ctrl+Alt+V<br>复制内容：Ctrl+Alt+C<br>全部导出采用 -c copy；切点受关键帧限制。<br>设置保存在本机 config.json。</small></section><section class="names-panel"><div class="toolbar"><strong>可选名称</strong><button id="import">导入名称</button></div><label>替换片段 <select id="nameTarget" aria-label="需要修改名称的片段"></select></label><small>在上方 names 行点击片段，或在这里选择，再点击名称按钮。</small><div id="nameList" class="name-list"></div></section></aside></main>
<dialog id="dialog"><form id="config"><h2>快捷键与倍速</h2><p>点击按键框后按下组合键。快捷键在应用窗口内生效。</p><div id="fields"></div><label>快进 / 快退秒数 <input id="seek" type="number" min="0.1" max="600" step="0.1"></label><label>音量调节百分比 <input id="volume" type="number" min="1" max="100"></label><p id="configError" role="alert"></p><div class="toolbar"><button type="button" id="reset">恢复默认</button><button type="button" id="cancel">取消</button><button type="submit">保存</button></div></form></dialog><dialog id="importDialog"><form id="importForm"><h2>导入可选名称</h2><label>分隔方式 <select id="delimiter"><option value="space">空格 / 换行</option><option value="comma">逗号 ,</option><option value="custom">自定义分隔符</option></select></label><label id="customRow" hidden>自定义分隔符 <input id="customDelimiter" placeholder="例如 | 或 ;"></label><label>文本文件 <input id="namesFile" type="file" accept=".txt,.csv,text/plain,text/csv"></label><textarea id="importText" placeholder="粘贴名称列表，或选择 UTF-8 文本文件"></textarea><p id="importError" role="alert"></p><div class="toolbar"><button id="importCancel" type="button">取消</button><button type="submit">导入并替换列表</button></div></form></dialog><script src="model.cjs"></script><script src="renderer.js"></script></html>
