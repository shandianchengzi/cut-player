<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'"><title>Cut Player</title><link rel="stylesheet" href="style.css">
<header><strong>◉ Cut Player</strong><span>视频时间记录工具</span><button id="settings">快捷键与倍速</button></header>
<main><section class="player"><div class="toolbar"><button id="open">打开视频</button><span id="name">选择本地视频，开始记录</span><input id="file" type="file" accept="video/*,.mkv,.mov,.m4v" hidden></div><video id="video" controls></video><div class="toolbar"><span id="clock">00:00:00.000</span><span id="rate">1×</span><button id="stamp">＋ 记录当前时间</button></div><p>← → 快退 / 快进 · ↑ ↓ 音量 · 1—4 切换倍速</p><div id="message" role="status"></div></section><aside><div class="toolbar"><strong>时间记录</strong><button id="copy">复制全部</button></div><div class="toolbar"><button id="export">按文本切视频</button></div><label><input id="audio" type="checkbox" checked>同时导出无损音频</label><textarea id="notes" placeholder="打开视频后，自动生成 breakpoints 与 names 两行"></textarea><small>记录时间：Ctrl+Alt+V<br>复制内容：Ctrl+Alt+C<br>全部导出采用 -c copy；切点受关键帧限制。<br>设置保存在本机 config.json。</small></aside></main>
<dialog id="dialog"><form id="config"><h2>快捷键与倍速</h2><p>点击按键框后按下组合键。快捷键在应用窗口内生效。</p><div id="fields"></div><label>快进 / 快退秒数 <input id="seek" type="number" min="0.1" max="600" step="0.1"></label><label>音量调节百分比 <input id="volume" type="number" min="1" max="100"></label><p id="configError" role="alert"></p><div class="toolbar"><button type="button" id="reset">恢复默认</button><button type="button" id="cancel">取消</button><button type="submit">保存</button></div></form></dialog><script src="model.cjs"></script><script src="renderer.js"></script></html>
